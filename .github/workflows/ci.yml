name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Content commits from the CMS are validated by `next build` on Vercel.
    paths-ignore:
      - "content/**"
      - "public/media/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests, build, e2e, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LEFTHOOK: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # Actions are pinned to a commit SHA (supply-chain protection); Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies (high and critical advisories)
        run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e

      - name: Lighthouse (median of 3 runs, mobile)
        run: |
          pnpm start --port 3000 &
          for attempt in $(seq 1 30); do
            curl --silent --fail http://localhost:3000 > /dev/null && break
            sleep 1
          done
          pnpm lighthouse

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
